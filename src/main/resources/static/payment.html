<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #fff4e5;
        }

        .payment-container {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border: 2px solid #d6b36a;
            border-radius: 16px;
            box-shadow: 0 8px 25px #0002;
        }

        h1 {
            color: #8b1e1e;
            text-align: center;
        }

        h2 {
            color: #8b1e1e;
        }

        .item {
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        label {
            display: block;
            margin: 15px 0 8px;
        }

        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .payment-option {
            margin: 12px 0;
        }

        .payment-option label {
            display: inline-block;
            margin: 0 0 0 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #8b1e1e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #641414;
        }

        .back-button {
            background: #666;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="payment-container">

        <h1>🛍️ Checkout</h1>

        <h2>Order Summary</h2>

        <div id="orderItems"></div>

        <h2>Total: <span id="totalAmount">₹0.00</span></h2>

        <form id="paymentForm">

            <h2>Delivery Details</h2>

            <label for="customerName">Full Name</label>
            <input type="text" id="customerName" required>

            <label for="phone">Mobile Number</label>
            <input
                type="tel"
                id="phone"
                pattern="[6-9][0-9]{9}"
                maxlength="10"
                required
            >

            <label for="address">Delivery Address</label>
            <textarea id="address" rows="3" required></textarea>

            <h2>Payment Method</h2>

            <div class="payment-option">
                <input
                    type="radio"
                    name="paymentMethod"
                    value="COD"
                    id="cod"
                    required
                >
                <label for="cod">Cash on Delivery</label>
            </div>

            <div class="payment-option">
                <input
                    type="radio"
                    name="paymentMethod"
                    value="UPI"
                    id="upi"
                >
                <label for="upi">UPI Payment (Demo)</label>
            </div>

            <div class="payment-option">
                <input
                    type="radio"
                    name="paymentMethod"
                    value="CARD"
                    id="card"
                >
                <label for="card">Debit / Credit Card (Demo)</label>
            </div>

            <button type="submit">Place Order</button>

            <button
                type="button"
                class="back-button"
                onclick="window.location.href='index.html'"
            >
                Back to Store
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const orderItems = document.getElementById("orderItems");
        const totalAmount = document.getElementById("totalAmount");
        const paymentForm = document.getElementById("paymentForm");

        let total = 0;

        if (cart.length === 0) {
            orderItems.textContent = "Your cart is empty.";
            paymentForm.style.display = "none";
            totalAmount.textContent = "₹0.00";
        } else {
            cart.forEach(item => {
                const subtotal = item.price * item.cartQuantity;
                total += subtotal;

                const div = document.createElement("div");
                div.className = "item";

                div.textContent =
                    item.name + " × " + item.cartQuantity +
                    " = ₹" + subtotal.toFixed(2);

                orderItems.appendChild(div);
            });

            totalAmount.textContent = "₹" + total.toFixed(2);
        }

        paymentForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            const method = document.querySelector(
                'input[name="paymentMethod"]:checked'
            );

            if (!method) {
                alert("Please select a payment method.");
                return;
            }

            // Real UPI/card payment is not integrated yet.
            if (method.value !== "COD") {
                alert(
                    "UPI/Card payment is currently in demo mode. " +
                    "Real payment gateway integration is required. " +
                    "Please select Cash on Delivery to test the order."
                );
                return;
            }

            const order = {
                orderId: "ORD" + Date.now(),
                customerName: document.getElementById("customerName").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                address: document.getElementById("address").value.trim(),
                paymentMethod: "Cash on Delivery",
                items: cart,
                total: total,
                orderDate: new Date().toLocaleString()
            };

            // Save order details for the confirmation page.
            localStorage.setItem("lastOrder", JSON.stringify(order));

            // Empty the cart after placing the order.
            localStorage.removeItem("cart");

            // Open the order confirmation page.
            window.location.href = "order-success.html";
        });
    </script>

</body>
</html>
